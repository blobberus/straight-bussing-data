name: Sync from straight-bussing
# Every 30 minutes: pull the shuttle arrival data (the app repo's 'data' branch) and the RouteKnower methodology
# (its 'main' branch) from the PUBLIC app repo github.com/blobberus/straight-bussing, rebuild the per-day / per-route
# CSVs, the viewer index and the README summary (scripts/sync.py), and commit only real changes. No secrets needed.
on:
  schedule: [{ cron: "4,34 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write          # keepalive: re-enable this workflow so GitHub's 60-day idle rule can't stop it
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch the sources (public repo)
        run: |
          git clone -q --depth 1 --branch data https://github.com/blobberus/straight-bussing.git "$RUNNER_TEMP/src-data"
          git clone -q --depth 1 --branch main https://github.com/blobberus/straight-bussing.git "$RUNNER_TEMP/src-main"
      - name: Rebuild
        run: python scripts/sync.py --src-data "$RUNNER_TEMP/src-data" --src-main "$RUNNER_TEMP/src-main" --out .
      - name: Commit and push real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data methodology README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
      - name: Keep the schedule alive
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || echo "keepalive failed (harmless)"
