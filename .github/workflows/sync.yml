name: Sync from straight-bussing
# Every 30 minutes: pull the shuttle arrival data (the app repo's 'data' branch) and the RouteKnower methodology
# (its 'main' branch) from the PUBLIC app repo github.com/blobberus/straight-bussing, rebuild the per-day / per-route
# CSVs, the viewer index and the README summary (scripts/sync.py), and commit only real changes. No secrets needed.
# Self-chaining since 2026-10-16 (app repo docs/DATA-COLLECTION-LOG.md DC-013): GitHub fired the cron below only about
# every 4 to 5 hours, so each run now starts the next one about 30 min later; the cron stays as a backstop. The
# concurrency group keeps at most one run waiting, so there is only ever one chain. Stop it: repo variable
# SYNC_CHAIN = off.
on:
  schedule: [{ cron: "4,34 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write          # keepalive: re-enable this workflow so GitHub's 60-day idle rule can't stop it
  issues: write           # the watchdog's collector-health issue in this repo
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # the chain step waits 25 min, then up to 17 min of dispatch retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch the sources (public repo)
        run: |
          git clone -q --depth 1 --branch data https://github.com/blobberus/straight-bussing.git "$RUNNER_TEMP/src-data"
          git clone -q --depth 1 --branch main https://github.com/blobberus/straight-bussing.git "$RUNNER_TEMP/src-main"
      - name: Rebuild
        run: python scripts/sync.py --src-data "$RUNNER_TEMP/src-data" --src-main "$RUNNER_TEMP/src-main" --out .
      - name: Commit and push real changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data methodology README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1
      - name: Watchdog - are buses running while the collector is stopped? (never fails the sync)
        # From outside the collector (app repo docs/DATA-COLLECTION-LOG.md DC-021): this chain runs on its own, so it
        # still runs when the collector's self-chain and cron have both stopped. The check is the app repo's
        # tools/health.py watchdog (cloned above): buses in Passio's feed but no collect run active and nothing merged for
        # 45 min opens the collector-health issue here (app repo DC-022 dropped a 3-hour rule). With a repository secret
        # COLLECT_DISPATCH_TOKEN (fine-grained, Actions read and write on blobberus/straight-bussing) it also restarts it.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_ISSUES: ${{ vars.HEALTH_ISSUES }}
          COLLECT_DISPATCH_TOKEN: ${{ secrets.COLLECT_DISPATCH_TOKEN }}
        run: python "$RUNNER_TEMP/src-main/tools/health.py" watchdog --src-data "$RUNNER_TEMP/src-data" || true
      - name: Keep the schedule alive
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || echo "keepalive failed (harmless)"
      - name: Chain the next sync in about 30 min (DC-013; retries DC-023)
        if: always() && vars.SYNC_CHAIN != 'off'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sleep 1500
          # A failed dispatch is tried again (1, 2, 4, 5, 5 min apart): on 2026-11-05 GitHub's API answered 500 for
          # minutes, the single try failed and the chain (and the watchdog) stopped for 2 hours (app repo DC-023).
          # The waiting check runs before every try, so a run GitHub created despite an error is never doubled.
          for try in 1 2 3 4 5 6; do
            waiting=$(gh run list -R "${{ github.repository }}" -w sync.yml -L 20 --json status               --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length' || echo 0)
            if [ "${waiting:-0}" -gt 0 ]; then echo "a sync is already waiting: no new link"; exit 0; fi
            if gh workflow run sync.yml -R "${{ github.repository }}" --ref main; then echo "next sync dispatched (try $try)"; exit 0; fi
            [ "$try" -ge 6 ] && break
            pause=$(( 60 * (1 << (try - 1)) )); [ "$pause" -gt 300 ] && pause=300
            echo "dispatch failed (try $try of 6); trying again in $pause s"
            sleep "$pause"
          done
          echo "::warning title=Sync chain::dispatch failed 6 times; the cron backstop still runs"
